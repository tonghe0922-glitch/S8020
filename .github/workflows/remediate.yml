name: S8020 one-shot remediation

on:
  push:
    branches:
      - fix/s8020-bootstrap-hardening

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.actor == 'tonghe0922-glitch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v5
        with:
          ref: fix/s8020-bootstrap-hardening
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply verified remediation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/remediation/part-* > /tmp/s8020-remediation.patch.gz.b64
          echo "915997ac05fb59fa728a4c48411a3e62ccd1251135a1c11b58ed9ebcd7eba5a0  /tmp/s8020-remediation.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/s8020-remediation.patch.gz.b64 > /tmp/s8020-remediation.patch.gz
          echo "3623ea4e9ea9806edb4b67958ec9682e0986e4695cecabb91918b0cf5fc44312  /tmp/s8020-remediation.patch.gz" | sha256sum -c -
          gzip -dc /tmp/s8020-remediation.patch.gz > /tmp/s8020-remediation.patch
          echo "b24825ced01d4fbebba991c909f26b6b6c09e8cdfdde7fecc9a299c535ee32c6  /tmp/s8020-remediation.patch" | sha256sum -c -
          git apply --index --binary /tmp/s8020-remediation.patch

      - name: Normalize every Java source with repository Spotless rules
        shell: bash
        run: bash ./mvnw -B -ntp spotless:apply

      - name: Validate remediation governance gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/quality/spring_proxyability.py
          python3 scripts/quality/phase11_duplication_guard.py
          python3 scripts/quality/flyway_versions.py --base-ref "${{ github.event.before }}"
          python3 scripts/quality/md_linkrot.py
          bash ./mvnw -B -ntp spotless:check

      - name: Commit normalized remediation and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/remediation .github/workflows/remediate.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete repository-wide remediation and quality gates"
          git push origin HEAD:fix/s8020-bootstrap-hardening
