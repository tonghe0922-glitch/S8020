name: Source Snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-snapshot.yml
      - .ci/source-ref.txt

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out S8020 control branch
        uses: actions/checkout@v4

      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          ref="refactor/s8020-clean-baseline"
          if [[ -f .ci/source-ref.txt ]]; then
            ref="$(tr -d '\r\n' < .ci/source-ref.txt)"
          fi
          test -n "$ref"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Download source snapshot
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          mkdir -p .ci-artifacts
          encoded_ref="${SOURCE_REF//\//%2F}"
          curl --fail --location --retry 3 \
            "https://api.github.com/repos/tonghe0922-glitch/PublicCompany/tarball/${encoded_ref}" \
            --output .ci-artifacts/source-tree.tar.gz
          test -s .ci-artifacts/source-tree.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-tree-${{ github.run_id }}
          path: .ci-artifacts/source-tree.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish workflow run identifier
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' "$GITHUB_RUN_ID" > .ci/source-snapshot-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .ci/source-snapshot-run-id
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record source snapshot run [skip ci]"
          git push
