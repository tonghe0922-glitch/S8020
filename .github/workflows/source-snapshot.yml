name: source-snapshot

on:
  push:
    branches:
      - feat/org-architecture-closed-loop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source archive
        shell: bash
        run: |
          git archive --format=zip --output=S8020-source.zip HEAD
          sha256sum S8020-source.zip > S8020-source.zip.sha256
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: S8020-source-snapshot
          path: |
            S8020-source.zip
            S8020-source.zip.sha256
          if-no-files-found: error
          retention-days: 3
