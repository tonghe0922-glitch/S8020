name: apply-org-lint-fixes

on:
  push:
    branches:
      - feat/org-architecture-closed-loop-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/org-architecture-closed-loop-v2
          fetch-depth: 0
      - name: Apply frontend quality fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('technical-platform/web/src/platform/pages/org/OrgArchitectureManagePage.vue')
          text = page.read_text()
          old = '''async function load(): Promise<void> {
            loading.value = true
            clearFeedback()
            try {
              if (canEdit.value) {
                try {
                  activate(await api.latestEditableDraft())
                } catch (cause) {
                  if (!(cause instanceof ApiClientError) || cause.status !== 404) throw cause
                }
              }
              await loadPending()
              if (!draft.value && pending.value[0]) activate(pending.value[0])
            } catch (cause) {
              error.value = architectureError(cause)
            } finally {
              loading.value = false
            }
          }
          '''
          new = '''async function restoreEditableDraft(): Promise<void> {
            if (!canEdit.value) return
            try {
              activate(await api.latestEditableDraft())
            } catch (cause) {
              if (!(cause instanceof ApiClientError) || cause.status !== 404) throw cause
            }
          }

          async function load(): Promise<void> {
            loading.value = true
            clearFeedback()
            try {
              await restoreEditableDraft()
              await loadPending()
              if (!draft.value && pending.value[0]) activate(pending.value[0])
            } catch (cause) {
              error.value = architectureError(cause)
            } finally {
              loading.value = false
            }
          }
          '''
          if old not in text:
              raise SystemExit('OrgArchitectureManagePage load block not found')
          page.write_text(text.replace(old, new))

          directory = Path('technical-platform/web/src/platform/pages/org/OrgDirectoryPage.vue')
          text = directory.read_text()
          old = "const props = defineProps<{ mode: 'architecture' | 'directory' }>()"
          if old not in text:
              raise SystemExit('OrgDirectoryPage props declaration not found')
          directory.write_text(text.replace(old, "defineProps<{ mode: 'architecture' | 'directory' }>()"))

          test = Path('technical-platform/web/src/services/org-architecture/org-architecture-api.test.ts')
          text = test.read_text()
          text = text.replace(
              "import type { usePortalSessionStore } from '../../session'",
              "import type { ApiRequestOptions } from '../../api'\nimport type { usePortalSessionStore } from '../../session'",
          )
          text = text.replace(
              "    const request = vi.fn().mockResolvedValue({})",
              "    const request = vi.fn<(path: string, options?: ApiRequestOptions) => Promise<unknown>>()\n      .mockResolvedValue({})",
              1,
          )
          text = text.replace(
              "    const request = vi.fn().mockResolvedValue({ versionNo: 1, organizations: [], members: [] })",
              "    const request = vi.fn<(path: string, options?: ApiRequestOptions) => Promise<unknown>>()\n      .mockResolvedValue({ versionNo: 1, organizations: [], members: [] })",
          )
          test.write_text(text)

          api = Path('technical-platform/web/src/services/org-architecture/org-architecture-api.ts')
          text = api.read_text()
          start = text.index('export function createOrgArchitectureApi')
          replacement = '''type SessionRequest = SessionStore['request']

          type NodeApi = Pick<OrgArchitectureApi,
            'tree' | 'directory' | 'createNode' | 'updateNode' | 'toggleNode' | 'deleteNode'>

          type DraftApi = Omit<OrgArchitectureApi, keyof NodeApi>

          function createNodeApi(request: SessionRequest): NodeApi {
            return {
              tree: () => request('/api/v1/org/tree'),
              directory: () => request('/api/v1/org/directory'),
              createNode: (body) => request('/api/v1/org/nodes', {
                method: 'POST', body, idempotencyKey: idempotencyKey('node-create'),
              }),
              updateNode: (nodeId, body) => request(`/api/v1/org/nodes/${encoded(nodeId)}`, {
                method: 'PUT', body, idempotencyKey: idempotencyKey('node-update'),
              }),
              toggleNode: (nodeId, body) => request(`/api/v1/org/nodes/${encoded(nodeId)}/toggle`, {
                method: 'POST', body, idempotencyKey: idempotencyKey('node-toggle'),
              }),
              deleteNode: (nodeId) => request(`/api/v1/org/nodes/${encoded(nodeId)}`, {
                method: 'DELETE', idempotencyKey: idempotencyKey('node-delete'),
              }),
            }
          }

          function createDraftApi(request: SessionRequest): DraftApi {
            return {
              draft: (draftId) => request(`/api/v1/org/drafts/${encoded(draftId)}`),
              latestEditableDraft: () => request('/api/v1/org/drafts/latest-editable'),
              pendingDrafts: () => request('/api/v1/org/drafts/pending'),
              createDraft: (title) => request('/api/v1/org/drafts', {
                method: 'POST', body: { title }, idempotencyKey: idempotencyKey('draft-create'),
              }),
              updateDraft: (draftId, title, expectedVersion, snapshot) => request(
                `/api/v1/org/drafts/${encoded(draftId)}`,
                {
                  method: 'PUT',
                  body: { title, expectedVersion, snapshot },
                  idempotencyKey: idempotencyKey('draft-update'),
                },
              ),
              submitDraft: (draftId, expectedVersion) => request(`/api/v1/org/drafts/${encoded(draftId)}/submit`, {
                method: 'POST', body: { expectedVersion }, idempotencyKey: idempotencyKey('draft-submit'),
              }),
              reviewDraft: (draftId, expectedVersion, approved, comment) => request(
                `/api/v1/org/drafts/${encoded(draftId)}/review`,
                {
                  method: 'POST',
                  body: { expectedVersion, approved, comment },
                  idempotencyKey: idempotencyKey('draft-review'),
                },
              ),
              publishDraft: (draftId, expectedVersion) => request(`/api/v1/org/drafts/${encoded(draftId)}/publish`, {
                method: 'POST', body: { expectedVersion }, idempotencyKey: idempotencyKey('draft-publish'),
              }),
              abandonDraft: (draftId, expectedVersion) => request(`/api/v1/org/drafts/${encoded(draftId)}/abandon`, {
                method: 'POST', body: { expectedVersion }, idempotencyKey: idempotencyKey('draft-abandon'),
              }),
            }
          }

          export function createOrgArchitectureApi(session: SessionStore): OrgArchitectureApi {
            return {
              ...createNodeApi(session.request),
              ...createDraftApi(session.request),
            }
          }
          '''
          api.write_text(text[:start] + replacement)
          PY
      - name: Commit checkpoint and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-org-lint-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add technical-platform/web/src/platform/pages/org/OrgArchitectureManagePage.vue \
                  technical-platform/web/src/platform/pages/org/OrgDirectoryPage.vue \
                  technical-platform/web/src/services/org-architecture/org-architecture-api.test.ts \
                  technical-platform/web/src/services/org-architecture/org-architecture-api.ts \
                  .github/workflows/apply-org-lint-fixes.yml
          git commit -m "fix: satisfy organization architecture frontend quality gates"
          git push origin HEAD:feat/org-architecture-closed-loop-v2
