name: Publish Verified Clean Baseline V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-clean-baseline-v2.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: publish-clean-baseline-v2
  cancel-in-progress: true

jobs:
  publish-verified-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out target repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve source and preserve generator
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(head -n 1 .ci/migration-request.txt | tr -d '\r\n')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          cp .github/workflows/migrate-clean-baseline.yml /tmp/migrate-generator.yml
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "MIGRATION_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Publish running status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="verified baseline publishing; run $GITHUB_RUN_ID" \
            -f context='s8020/baseline-publish'

      - name: Download verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://api.github.com/repos/tonghe0922-glitch/PublicCompany/tarball/$SOURCE_SHA" \
            --output /tmp/source.tar.gz
          mkdir -p /tmp/source
          tar -xzf /tmp/source.tar.gz -C /tmp/source --strip-components=1
          test -f /tmp/source/pom.xml
          test -f /tmp/source/technical-platform/web/package.json
          test -f /tmp/source/technical-platform/web/work.html
          test -f /tmp/source/technical-platform/web/tech.html
          test ! -f /tmp/source/.github/workflows/harden-s8020-baseline.yml

      - name: Replace repository with audited whitelist
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for file in .editorconfig .env.example .gitattributes .gitignore mvnw mvnw.cmd pom.xml; do
            cp "/tmp/source/$file" "$file"
          done
          cp -a /tmp/source/.mvn .
          cp -a /tmp/source/docker .
          cp -a /tmp/source/technical-platform .
          mkdir -p scripts
          cp -a /tmp/source/scripts/database scripts/

          rm -f technical-platform/web/playwright.phase*.config.ts
          rm -rf technical-platform/web/e2e
          rm -rf technical-platform/web/reports technical-platform/web/coverage
          rm -rf technical-platform/web/dist technical-platform/web/node_modules
          find technical-platform -type d -name target -prune -exec rm -rf {} +

      - name: Reuse reviewed two-port repository generator
        shell: bash
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          MIGRATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/migrate-generator.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Generate clean two-port repository files'
          try:
              marker_index = lines.index(marker)
              run_index = next(
                  index
                  for index in range(marker_index + 1, len(lines))
                  if lines[index] == '        run: |'
              )
              end_index = next(
                  index
                  for index in range(run_index + 1, len(lines))
                  if lines[index].startswith('      - name: ')
              )
          except (ValueError, StopIteration) as exc:
              raise SystemExit('Unable to extract reviewed repository generator') from exc

          body = []
          for line in lines[run_index + 1:end_index]:
              if line and not line.startswith('          '):
                  raise SystemExit(f'Unexpected generator indentation: {line!r}')
              body.append(line[10:] if line else '')
          Path('/tmp/generate-reviewed-baseline.sh').write_text(
              '\n'.join(body) + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/generate-reviewed-baseline.sh

      - name: Verify repository hygiene before tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/two_port_guard.py
          test ! -e "Knowledge Base"
          test ! -e "Construction Master Schedule.csv"
          test ! -e docs/implementation
          test ! -e .tmp
          ! find technical-platform/web -maxdepth 1 -type f -name 'playwright.phase*.config.ts' -print -quit | grep -q .

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests and Java quality
        shell: bash
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api,technical-platform/backend/apps/worker -am test

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Install frontend dependencies
        shell: bash
        working-directory: technical-platform/web
        run: pnpm install --frozen-lockfile

      - name: Run frontend static quality gates
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm quality:duplicates
          NODE_OPTIONS=--max-old-space-size=4096 pnpm quality:deadcode
          pnpm quality:ports

      - name: Run frontend unit tests
        shell: bash
        working-directory: technical-platform/web
        run: pnpm test

      - name: Build both runtime ports
        shell: bash
        working-directory: technical-platform/web
        run: pnpm build

      - name: Run browser smoke tests
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Validate Docker Compose
        shell: bash
        run: docker compose --env-file .env.example -f docker/compose/docker-compose.dev.yml config >/tmp/compose.yml

      - name: Commit and push verified application tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf technical-platform/web/node_modules
          rm -rf technical-platform/web/dist
          rm -rf technical-platform/web/reports
          rm -rf technical-platform/web/playwright-report
          rm -rf technical-platform/web/test-results
          find technical-platform -type d -name target -prune -exec rm -rf {} +
          rm -rf .ci

          # GitHub Actions' token may not mutate workflow files. Restore the
          # exact workflow directory from the triggering commit; the connected
          # GitHub client will install the final CI workflow after this push.
          rm -rf .github/workflows
          git checkout "$GITHUB_SHA" -- .github/workflows
          test -z "$(git status --porcelain -- .github/workflows)"

          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: establish verified S8020 two-port baseline"
          git push origin HEAD:main

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state='success'
          else
            state='failure'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="verified baseline publish $JOB_STATUS; run $GITHUB_RUN_ID" \
            -f context='s8020/baseline-publish'
