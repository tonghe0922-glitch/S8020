name: S8020 temporary Phase11 type fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-phase11-type-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/s8020-bootstrap-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v5
        with:
          ref: fix/s8020-bootstrap-hardening
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply enum-to-string type fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11/Phase11ApiSupport.java")
          source = path.read_text(encoding="utf-8")
          old = "throw denied(processCode, decision.reason());"
          new = "throw denied(processCode, decision.reason().name());"
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          elif new not in source:
              raise SystemExit("expected Phase11 authorization line was not found")
          PY
          bash ./mvnw -B -ntp spotless:check
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests compile

      - name: Commit the validated source-only fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Phase11 type fix is already present."
            exit 0
          fi
          git add technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11/Phase11ApiSupport.java
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve typed Phase11 authorization reason"
          git push origin HEAD:fix/s8020-bootstrap-hardening
