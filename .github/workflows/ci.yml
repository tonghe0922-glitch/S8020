name: S8020 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: s8020-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-two-port-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish running status
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="S8020 full CI running; run $GITHUB_RUN_ID" \
            -f context='s8020/full-ci'

      - name: Verify clean repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test ! -e .ci
          test ! -e .tmp
          test ! -e "Knowledge Base"
          test ! -e "Construction Master Schedule.csv"
          test ! -e docs/implementation
          test -f technical-platform/web/work.html
          test -f technical-platform/web/tech.html
          test ! -f technical-platform/web/admin.html
          test ! -f technical-platform/web/employee.html
          test ! -f technical-platform/web/center.html
          test -x scripts/dev/check-env.sh
          test -x scripts/dev/api-run.sh
          test -x scripts/quality/spring_proxyability.py
          test -x scripts/quality/phase11_duplication_guard.py
          test -x scripts/quality/flyway_versions.py
          test -x scripts/quality/md_linkrot.py
          python3 scripts/quality/two_port_guard.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run repository governance guards
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/quality/spring_proxyability.py
          python3 scripts/quality/phase11_duplication_guard.py
          python3 scripts/quality/md_linkrot.py
          if [[ -n "${BASE_SHA}" ]]; then
            python3 scripts/quality/flyway_versions.py --base-ref "${BASE_SHA}"
          else
            python3 scripts/quality/flyway_versions.py
          fi

      - name: Run full-repository Java formatting gate
        shell: bash
        run: bash ./mvnw -B -ntp spotless:check

      - name: Run backend tests and Java quality gates
        shell: bash
        run: >-
          bash ./mvnw -B -ntp
          -pl technical-platform/backend/modules/database-baseline,technical-platform/backend/apps/api,technical-platform/backend/apps/worker
          -am test

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Install frontend dependencies
        shell: bash
        working-directory: technical-platform/web
        run: pnpm install --frozen-lockfile

      - name: Run frontend static quality gates
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm quality:duplicates
          NODE_OPTIONS=--max-old-space-size=4096 pnpm quality:deadcode
          pnpm quality:ports

      - name: Run frontend unit tests
        shell: bash
        working-directory: technical-platform/web
        run: pnpm test

      - name: Build work and tech ports
        shell: bash
        working-directory: technical-platform/web
        run: pnpm build

      - name: Run browser smoke tests
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Validate Docker Compose configuration
        shell: bash
        run: docker compose --env-file .env.example -f docker/compose/docker-compose.dev.yml config >/tmp/s8020-compose.yml

      - name: Publish final status
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state='success'
          else
            state='failure'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="S8020 full CI $JOB_STATUS; run $GITHUB_RUN_ID" \
            -f context='s8020/full-ci'

  cold-start-smoke:
    name: cold-start-migrate-login
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Package source snapshot for remediation diagnostics
        shell: bash
        run: git archive --format=zip --output=/tmp/s8020-source.zip HEAD

      - name: Upload source snapshot for remediation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: s8020-source-${{ github.sha }}
          path: /tmp/s8020-source.zip
          retention-days: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Install pnpm and BCrypt helper
        shell: bash
        run: |
          npm install --global pnpm@10.34.0
          python3 -m pip install --disable-pip-version-check --quiet bcrypt==4.2.1

      - name: Generate ephemeral cold-start environment
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_password="$(openssl rand -hex 24)"
          migration_password="$(openssl rand -hex 24)"
          api_password="$(openssl rand -hex 24)"
          worker_password="$(openssl rand -hex 24)"
          audit_writer_password="$(openssl rand -hex 24)"
          auditor_password="$(openssl rand -hex 24)"
          dw_writer_password="$(openssl rand -hex 24)"
          dw_reader_password="$(openssl rand -hex 24)"
          admin_password="$(openssl rand -hex 18)Aa!"
          admin_hash="$(ADMIN_PASSWORD="$admin_password" python3 - <<'PY'
          import bcrypt
          import os
          print(bcrypt.hashpw(os.environ["ADMIN_PASSWORD"].encode(), bcrypt.gensalt(rounds=12)).decode())
          PY
          )"
          tenant_id="$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"

          cat >.env <<EOF
          POSTGRES_USER=sjg_bootstrap
          POSTGRES_PASSWORD=${bootstrap_password}
          POSTGRES_DB=postgres
          POSTGRES_PORT=5432
          SJG_BOOTSTRAP_DB_URL=jdbc:postgresql://127.0.0.1:5432/postgres
          SJG_BOOTSTRAP_DB_USERNAME=sjg_bootstrap
          SJG_BOOTSTRAP_DB_PASSWORD=${bootstrap_password}
          SJG_MIGRATION_DB_USERNAME=sjg_migration
          SJG_MIGRATION_DB_PASSWORD=${migration_password}
          SJG_OMS_MIGRATION_DB_URL=jdbc:postgresql://127.0.0.1:5432/sjg_oms
          SJG_AUDIT_MIGRATION_DB_URL=jdbc:postgresql://127.0.0.1:5432/sjg_audit
          SJG_DW_MIGRATION_DB_URL=jdbc:postgresql://127.0.0.1:5432/sjg_dw
          SJG_API_DB_URL=jdbc:postgresql://127.0.0.1:5432/sjg_oms
          SJG_API_DB_USERNAME=sjg_api_runtime
          SJG_API_DB_PASSWORD=${api_password}
          SJG_WORKER_DB_URL=jdbc:postgresql://127.0.0.1:5432/sjg_oms
          SJG_WORKER_DB_USERNAME=sjg_worker_runtime
          SJG_WORKER_DB_PASSWORD=${worker_password}
          SJG_AUDIT_WRITER_DB_PASSWORD=${audit_writer_password}
          SJG_AUDITOR_DB_PASSWORD=${auditor_password}
          SJG_DW_WRITER_DB_PASSWORD=${dw_writer_password}
          SJG_DW_READER_DB_PASSWORD=${dw_reader_password}
          SJG_AUDIT_DB_URL=jdbc:postgresql://127.0.0.1:5432/sjg_audit
          SJG_AUDIT_DB_USERNAME=sjg_audit_writer
          SJG_AUDIT_DB_PASSWORD=${audit_writer_password}
          SJG_SECURITY_AUDIT_MODE=fail-closed
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=
          SJG_TENANT_ID=${tenant_id}
          SJG_TENANT_CODE=ci-tenant
          SJG_TENANT_NAME='S8020 CI Tenant'
          SJG_ADMIN_LOGIN_NAME=admin
          SJG_ADMIN_EMPLOYEE_NO=S8020-CI-E001
          SJG_ADMIN_PASSWORD_HASH='${admin_hash}'
          MINIO_ROOT_USER=s8020minio
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)
          MINIO_API_PORT=9000
          MINIO_CONSOLE_PORT=9001
          RABBITMQ_DEFAULT_USER=s8020
          RABBITMQ_DEFAULT_PASS=$(openssl rand -hex 24)
          RABBITMQ_AMQP_PORT=5672
          RABBITMQ_MANAGEMENT_PORT=15672
          API_PORT=8080
          WORK_WEB_PORT=5173
          TECH_WEB_PORT=5175
          EOF

          printf '%s' "$admin_password" >/tmp/s8020-admin-password
          chmod 600 /tmp/s8020-admin-password .env
          bash scripts/dev/check-env.sh

      - name: Run real migration and login path
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file .env -f docker/compose/docker-compose.dev.yml)
          "${compose[@]}" up --wait --wait-timeout 180 -d postgres redis

          set -a
          source .env
          set +a

          bash scripts/database/migrate.sh 2>&1 | tee /tmp/s8020-migrate.log
          if grep -Eq '\$2[aby]\$12\$[./A-Za-z0-9]{53}' /tmp/s8020-migrate.log; then
            echo "BCrypt hash leaked into migration output" >&2
            exit 1
          fi

          account_state="$("${compose[@]}" exec -T postgres \
            psql -U "$POSTGRES_USER" -d sjg_oms -Atv ON_ERROR_STOP=1 \
            -c "SELECT login_name || ':' || status || ':' || mfa_level FROM iam.user_account WHERE login_name='${SJG_ADMIN_LOGIN_NAME}' AND NOT is_deleted;")"
          test "$account_state" = "admin:ACTIVE:0"

          bash scripts/dev/api-run.sh >/tmp/s8020-api.log 2>&1 &
          echo $! >/tmp/s8020-api.pid

          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/tmp/s8020-health.json; then
              break
            fi
            if ! kill -0 "$(cat /tmp/s8020-api.pid)" 2>/dev/null; then
              cat /tmp/s8020-api.log >&2
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health | jq -e '.status == "UP"'

          admin_password="$(cat /tmp/s8020-admin-password)"
          login_payload="$(jq -nc \
            --arg tenant "$SJG_TENANT_CODE" \
            --arg login "$SJG_ADMIN_LOGIN_NAME" \
            --arg password "$admin_password" \
            '{tenantCode:$tenant,loginName:$login,password:$password,identityId:null,mfaCode:null}')"

          login_status="$(curl -sS -o /tmp/s8020-login.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data "$login_payload")"
          if [[ "$login_status" != "200" ]]; then
            cat /tmp/s8020-login.json >&2
            cat /tmp/s8020-api.log >&2
            exit 1
          fi
          access_token="$(jq -er '.accessToken' /tmp/s8020-login.json)"
          jq -e '.refreshToken | strings | length > 0' /tmp/s8020-login.json

          curl -fsS http://127.0.0.1:8080/api/v1/session \
            -H "Authorization: Bearer ${access_token}" \
            | jq -e '.tenantId and .userId and .identityId'

          rejected_payload="$(jq -nc \
            --arg tenant "$SJG_TENANT_CODE" \
            --arg login "$SJG_ADMIN_LOGIN_NAME" \
            '{tenantCode:$tenant,loginName:$login,password:"definitely-wrong",identityId:null,mfaCode:null}')"
          rejected_status="$(curl -sS -o /tmp/s8020-rejected.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data "$rejected_payload")"
          test "$rejected_status" = "401"
          jq -e '.code == "authentication_rejected" and (.requestId | strings | length > 0)' /tmp/s8020-rejected.json

          rejected_count="$("${compose[@]}" exec -T postgres \
            psql -U "$POSTGRES_USER" -d sjg_audit -Atv ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM audit.security_event WHERE event_type='LOGIN_REJECTED';")"
          test "$rejected_count" -ge 1

      - name: Exercise Redis and audit failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file .env -f docker/compose/docker-compose.dev.yml)

          set -a
          source .env
          set +a

          admin_password="$(cat /tmp/s8020-admin-password)"
          login_payload="$(jq -nc \
            --arg tenant "$SJG_TENANT_CODE" \
            --arg login "$SJG_ADMIN_LOGIN_NAME" \
            --arg password "$admin_password" \
            '{tenantCode:$tenant,loginName:$login,password:$password,identityId:null,mfaCode:null}')"

          stop_api() {
            if [[ ! -f /tmp/s8020-api.pid ]]; then
              return
            fi
            local pid
            pid="$(cat /tmp/s8020-api.pid)"
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f /tmp/s8020-api.pid
            for _ in $(seq 1 30); do
              if ! curl -sS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
                return
              fi
              sleep 1
            done
            echo "API did not stop cleanly" >&2
            exit 1
          }

          start_api() {
            local env_file="$1"
            local log_file="$2"
            local expected_health_status="$3"
            SJG_ENV_FILE="$env_file" bash scripts/dev/api-run.sh >"$log_file" 2>&1 &
            echo $! >/tmp/s8020-api.pid
            for _ in $(seq 1 120); do
              local status
              status="$(curl -sS -o /tmp/s8020-health.json -w '%{http_code}' \
                http://127.0.0.1:8080/actuator/health 2>/dev/null || true)"
              if [[ "$status" == "$expected_health_status" ]]; then
                return
              fi
              if ! kill -0 "$(cat /tmp/s8020-api.pid)" 2>/dev/null; then
                cat "$log_file" >&2
                exit 1
              fi
              sleep 2
            done
            cat "$log_file" >&2
            echo "API health did not reach HTTP $expected_health_status" >&2
            exit 1
          }

          "${compose[@]}" stop redis
          redis_status="$(curl -sS -o /tmp/s8020-redis-down.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data "$login_payload")"
          test "$redis_status" = "503"
          jq -e '.code == "session_store_unavailable" and (.requestId | strings | length > 0)' \
            /tmp/s8020-redis-down.json
          "${compose[@]}" start redis
          for _ in $(seq 1 60); do
            if "${compose[@]}" exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
              break
            fi
            sleep 1
          done
          "${compose[@]}" exec -T redis redis-cli ping | grep -q PONG

          stop_api

          cp .env /tmp/s8020-audit-fail-open.env
          sed -i \
            's|^SJG_AUDIT_DB_URL=.*|SJG_AUDIT_DB_URL=jdbc:postgresql://127.0.0.1:1/sjg_audit?connectTimeout=1|' \
            /tmp/s8020-audit-fail-open.env
          sed -i 's|^SJG_SECURITY_AUDIT_MODE=.*|SJG_SECURITY_AUDIT_MODE=fail-open|' \
            /tmp/s8020-audit-fail-open.env
          bash scripts/dev/check-env.sh /tmp/s8020-audit-fail-open.env
          start_api /tmp/s8020-audit-fail-open.env /tmp/s8020-api-fail-open.log 200

          fail_open_status="$(curl -sS -o /tmp/s8020-audit-fail-open.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data "$login_payload")"
          test "$fail_open_status" = "200"
          fail_open_token="$(jq -er '.accessToken' /tmp/s8020-audit-fail-open.json)"
          grep -q 'Security audit fallback mode=fail-open' /tmp/s8020-api-fail-open.log
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8080/api/v1/auth/logout \
            -H "Authorization: Bearer ${fail_open_token}"
          stop_api

          cp .env /tmp/s8020-audit-fail-closed.env
          sed -i \
            's|^SJG_AUDIT_DB_URL=.*|SJG_AUDIT_DB_URL=jdbc:postgresql://127.0.0.1:1/sjg_audit?connectTimeout=1|' \
            /tmp/s8020-audit-fail-closed.env
          sed -i 's|^SJG_SECURITY_AUDIT_MODE=.*|SJG_SECURITY_AUDIT_MODE=fail-closed|' \
            /tmp/s8020-audit-fail-closed.env
          bash scripts/dev/check-env.sh /tmp/s8020-audit-fail-closed.env
          start_api /tmp/s8020-audit-fail-closed.env /tmp/s8020-api-fail-closed.log 503

          fail_closed_status="$(curl -sS -o /tmp/s8020-audit-fail-closed.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data "$login_payload")"
          test "$fail_closed_status" = "503"
          jq -e '.code == "security_audit_unavailable" and (.requestId | strings | length > 0)' \
            /tmp/s8020-audit-fail-closed.json
          grep -q 'Security audit fallback mode=fail-closed' /tmp/s8020-api-fail-closed.log
          stop_api

      - name: Build both frontend ports
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/s8020-api.log 2>/dev/null || true
          cat /tmp/s8020-api-fail-open.log 2>/dev/null || true
          cat /tmp/s8020-api-fail-closed.log 2>/dev/null || true
          docker compose --env-file .env -f docker/compose/docker-compose.dev.yml ps || true
          docker compose --env-file .env -f docker/compose/docker-compose.dev.yml logs --tail=200 postgres redis || true

      - name: Clean up cold-start services
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/s8020-api.pid ]]; then
            pid="$(cat /tmp/s8020-api.pid)"
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
          fi
          docker compose --env-file .env -f docker/compose/docker-compose.dev.yml down -v --remove-orphans || true
          rm -f .env /tmp/s8020-admin-password /tmp/s8020-login.json /tmp/s8020-rejected.json \
            /tmp/s8020-redis-down.json /tmp/s8020-audit-fail-open.env \
            /tmp/s8020-audit-fail-closed.env /tmp/s8020-audit-fail-open.json \
            /tmp/s8020-audit-fail-closed.json /tmp/s8020-health.json /tmp/s8020-migrate.log
