name: S8020 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: s8020-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-two-port-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Publish running status
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="S8020 full CI running; run $GITHUB_RUN_ID" \
            -f context='s8020/full-ci'

      - name: Verify clean repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test ! -e .ci
          test ! -e .tmp
          test ! -e "Knowledge Base"
          test ! -e "Construction Master Schedule.csv"
          test ! -e docs/implementation
          test -f technical-platform/web/work.html
          test -f technical-platform/web/tech.html
          test ! -f technical-platform/web/admin.html
          test ! -f technical-platform/web/employee.html
          test ! -f technical-platform/web/center.html
          python scripts/quality/two_port_guard.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests and Java quality gates
        shell: bash
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api,technical-platform/backend/apps/worker -am test

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Install frontend dependencies
        shell: bash
        working-directory: technical-platform/web
        run: pnpm install --frozen-lockfile

      - name: Run frontend static quality gates
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm quality:duplicates
          NODE_OPTIONS=--max-old-space-size=4096 pnpm quality:deadcode
          pnpm quality:ports

      - name: Run frontend unit tests
        shell: bash
        working-directory: technical-platform/web
        run: pnpm test

      - name: Build work and tech ports
        shell: bash
        working-directory: technical-platform/web
        run: pnpm build

      - name: Run browser smoke tests
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Validate Docker Compose configuration
        shell: bash
        run: docker compose --env-file .env.example -f docker/compose/docker-compose.dev.yml config >/tmp/s8020-compose.yml

      - name: Publish final status
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state='success'
          else
            state='failure'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="S8020 full CI $JOB_STATUS; run $GITHUB_RUN_ID" \
            -f context='s8020/full-ci'
