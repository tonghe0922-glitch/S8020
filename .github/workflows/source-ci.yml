name: Source Candidate CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-ci.yml
      - .ci/source-ci-request.txt

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out CI control repository
        uses: actions/checkout@v4

      - name: Record workflow run
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' "$GITHUB_RUN_ID" > .ci/source-ci-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .ci/source-ci-run-id
          if ! git diff --cached --quiet; then
            git commit -m "chore: record source CI run [skip ci]"
            git push
          fi

      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          ref="refactor/s8020-clean-baseline"
          if [[ -f .ci/source-ci-request.txt ]]; then
            ref="$(head -n 1 .ci/source-ci-request.txt | tr -d '\r\n')"
          fi
          test -n "$ref"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Download source candidate
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          encoded_ref="${SOURCE_REF//\//%2F}"
          curl --fail --location --retry 3 \
            "https://api.github.com/repos/tonghe0922-glitch/PublicCompany/tarball/${encoded_ref}" \
            --output /tmp/source-candidate.tar.gz
          mkdir -p /tmp/source-candidate
          tar -xzf /tmp/source-candidate.tar.gz -C /tmp/source-candidate --strip-components=1
          test -f /tmp/source-candidate/pom.xml
          test -f /tmp/source-candidate/technical-platform/web/package.json

      - name: Apply clean-baseline candidate
        shell: bash
        working-directory: /tmp/source-candidate
        run: |
          cat .tmp/s8020-patch/part-* > /tmp/s8020-fix.patch
          cat .tmp/s8020-overlay/part-* | base64 --decode > /tmp/s8020-overlay.tar.gz
          sha256sum /tmp/s8020-fix.patch /tmp/s8020-overlay.tar.gz
          test -s /tmp/s8020-fix.patch
          test -s /tmp/s8020-overlay.tar.gz
          tar -tzf /tmp/s8020-overlay.tar.gz | sed -n '1,120p'

          git init -q
          git config user.name ci
          git config user.email ci@example.invalid
          git add -A
          git commit -qm baseline

          git apply --index --3way --whitespace=nowarn \
            --exclude=technical-platform/backend/modules/iam/src/main/java/cn/shangjingu/platform/iam/session/SessionService.java \
            --exclude=technical-platform/web/src/router/navigation-catalog.ts \
            /tmp/s8020-fix.patch

          tar -xzf /tmp/s8020-overlay.tar.gz -C .
          git add -A
          git rm -f technical-platform/web/src/router/generated/portal-ia-navigation.json
          git rm -rf .tmp/s8020-patch .tmp/s8020-overlay
          git rm -f .github/workflows/s8020-source-export.yml
          git diff --cached --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Repository hygiene
        shell: bash
        working-directory: /tmp/source-candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {'.DS_Store', 'Thumbs.db'}
          bad = []
          for path in Path('.').rglob('*'):
              if path.is_file() and (
                  path.name in forbidden
                  or any(part in {'node_modules', 'dist', 'target', 'coverage'} for part in path.parts)
              ):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Forbidden generated files:\n' + '\n'.join(bad[:200]))
          PY

      - name: Backend unit and module tests
        id: backend
        shell: bash
        working-directory: /tmp/source-candidate
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api,technical-platform/backend/apps/worker -am test

      - name: Frontend install
        shell: bash
        working-directory: /tmp/source-candidate/technical-platform/web
        run: pnpm install --frozen-lockfile

      - name: Frontend static checks
        id: frontend_static
        shell: bash
        working-directory: /tmp/source-candidate/technical-platform/web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm quality:duplicates
          NODE_OPTIONS=--max-old-space-size=4096 pnpm quality:deadcode

      - name: Frontend unit tests
        id: frontend_test
        shell: bash
        working-directory: /tmp/source-candidate/technical-platform/web
        run: pnpm test

      - name: Frontend production build
        id: frontend_build
        shell: bash
        working-directory: /tmp/source-candidate/technical-platform/web
        run: pnpm build

      - name: Docker Compose validation
        id: compose
        shell: bash
        working-directory: /tmp/source-candidate
        run: docker compose --env-file .env.example -f docker/compose/docker-compose.dev.yml config >/tmp/s8020-compose.yml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ci-reports-${{ github.run_id }}
          path: |
            /tmp/source-candidate/technical-platform/**/target/surefire-reports
            /tmp/source-candidate/technical-platform/web/reports
            /tmp/source-candidate/technical-platform/web/coverage
            /tmp/s8020-compose.yml
          if-no-files-found: ignore
          retention-days: 7
