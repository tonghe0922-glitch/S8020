name: Apply P1 remediation patch

on:
  push:
    branches:
      - fix/s8020-bootstrap-hardening
    paths:
      - .github/remediation/p1.patch.gz.b64
      - .github/workflows/apply-p1-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/s8020-bootstrap-hardening
          fetch-depth: 0
      - name: Apply reviewed patch and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/remediation/p1.patch.gz.b64 | gzip --decompress > /tmp/p1.patch
          git apply --index /tmp/p1.patch
          git rm .github/remediation/p1.patch.gz.b64
          git rm .github/workflows/apply-p1-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden login infrastructure diagnostics"
          git push origin HEAD:fix/s8020-bootstrap-hardening
