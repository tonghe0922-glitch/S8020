name: S8020 finalize remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: s8020-finalize-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    name: generate-format-and-commit-final-remediation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate complete organization directory migration
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/database/.generate_org_directory_seed.part-*.b64 \
            | tr -d '\n' \
            | base64 --decode \
            > scripts/database/generate_org_directory_seed.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/database/generate_org_directory_seed.py')
          path.write_text(
              path.read_text(encoding='utf-8').replace('叶孝縅', '叶孝帅'),
              encoding='utf-8',
          )
          PY
          chmod +x scripts/database/generate_org_directory_seed.py
          python3 -m py_compile scripts/database/generate_org_directory_seed.py
          python3 scripts/database/generate_org_directory_seed.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('technical-platform/database/seeds/org-directory-seed-manifest.json').read_text(encoding='utf-8'))
          assert manifest['organizationCount'] == 59, manifest
          assert manifest['employeeCount'] == 205, manifest
          assert manifest['appointmentCount'] == 217, manifest
          assert manifest['organizationCodes'] == [f'S06-ORG-{i:03d}' for i in range(1, 60)], manifest
          assert manifest['employeeNumbers'] == [f'S06-E{i:03d}' for i in range(1, 206)], manifest
          assert manifest['appointmentCodes'] == [f'S06-APPT-{i:03d}' for i in range(1, 218)], manifest
          PY

      - name: Apply repository Java formatter
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp spotless:apply
          bash ./mvnw -B -ntp spotless:check

      - name: Commit generated migration and remove temporary payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/database/.generate_org_directory_seed.part-*.b64
          rm -f .github/workflows/finalize-org-directory-remediation.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/ci.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: generate complete organization directory migration'
          git push origin "HEAD:${BRANCH_NAME}"
