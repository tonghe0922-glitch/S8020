name: Fix organization UI lint findings

on:
  push:
    branches: [feat/replicate-org-detail-pages-20260824]

permissions:
  contents: write

concurrency:
  group: fix-org-ui-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/replicate-org-detail-pages-20260824
          fetch-depth: 0

      - name: Apply focused lint refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          tech = root / 'technical-platform/web/src/platform/pages/org/OrgArchitectureTechPage.vue'
          text = tech.read_text(encoding='utf-8')
          text = text.replace(
              "type DetailTab = 'overview' | 'members' | 'permissions'\n",
              "type DetailTab = 'overview' | 'members' | 'permissions'\n\ninterface OrgArchitectureTreeHandle {\n  expandAll: () => void\n  collapseAll: () => void\n}\n",
          )
          text = text.replace(
              "const treeRef = ref<InstanceType<typeof OrgArchitectureTree> | null>(null)",
              "const treeRef = ref<OrgArchitectureTreeHandle | null>(null)",
          )
          tech.write_text(text, encoding='utf-8')

          tree = root / 'technical-platform/web/src/platform/pages/org/OrgArchitectureTree.vue'
          text = tree.read_text(encoding='utf-8')
          old = """const matchingIds = computed(() => {
            const keyword = props.query.trim().toLocaleLowerCase('zh-CN')
            const directMatches = new Set<string>()
            for (const node of props.nodes) {
              const matchesQuery = !keyword || [node.orgName, node.orgCode, orgTypeLabel(node.orgType)]
                .some((value) => value.toLocaleLowerCase('zh-CN').includes(keyword))
              const matchesType = !props.typeFilter || node.orgType === props.typeFilter
              const matchesStatus = !props.statusFilter || node.status === props.statusFilter
              if (matchesQuery && matchesType && matchesStatus) directMatches.add(node.id)
            }
            if (!keyword && !props.typeFilter && !props.statusFilter) return directMatches

            const visible = new Set(directMatches)
            for (const id of directMatches) {
              let current = nodeMap.value.get(id)
              while (current?.parentId) {
                visible.add(current.parentId)
                current = nodeMap.value.get(current.parentId)
              }
            }
            return visible
          })
          """
          new = """function matchesQuery(node: OrgArchitectureNode, keyword: string): boolean {
            if (!keyword) return true
            return [node.orgName, node.orgCode, orgTypeLabel(node.orgType)]
              .some((value) => value.toLocaleLowerCase('zh-CN').includes(keyword))
          }

          function matchesType(node: OrgArchitectureNode): boolean {
            return !props.typeFilter || node.orgType === props.typeFilter
          }

          function matchesStatus(node: OrgArchitectureNode): boolean {
            return !props.statusFilter || node.status === props.statusFilter
          }

          function matchesFilters(node: OrgArchitectureNode, keyword: string): boolean {
            return matchesQuery(node, keyword) && matchesType(node) && matchesStatus(node)
          }

          function filteringActive(keyword: string): boolean {
            return Boolean(keyword || props.typeFilter || props.statusFilter)
          }

          function addAncestors(nodeId: string, visibleIds: Set<string>): void {
            let current = nodeMap.value.get(nodeId)
            while (current?.parentId) {
              visibleIds.add(current.parentId)
              current = nodeMap.value.get(current.parentId)
            }
          }

          const matchingIds = computed(() => {
            const keyword = props.query.trim().toLocaleLowerCase('zh-CN')
            const directMatches = new Set(
              props.nodes.filter((node) => matchesFilters(node, keyword)).map((node) => node.id),
            )
            if (!filteringActive(keyword)) return directMatches

            const visibleIds = new Set(directMatches)
            directMatches.forEach((nodeId) => addAncestors(nodeId, visibleIds))
            return visibleIds
          })
          """
          if old not in text:
              raise SystemExit('OrgArchitectureTree.vue target block not found')
          tree.write_text(text.replace(old, new), encoding='utf-8')

          directory = root / 'technical-platform/web/src/platform/pages/org/OrgDirectoryPage.vue'
          text = directory.read_text(encoding='utf-8')
          old = """const displayedOrganizations = computed(() => {
            const keyword = props.mode === 'architecture' ? query.value.trim().toLocaleLowerCase('zh-CN') : ''
            if (!keyword && !typeFilter.value) return data.value.organizations

            const nodeMap = new Map(data.value.organizations.map((node) => [node.id, node]))
            const visibleIds = new Set<string>()
            for (const node of data.value.organizations) {
              const matchesKeyword = !keyword || [node.orgName, node.orgCode, orgTypeLabel(node.orgType)]
                .some((value) => value.toLocaleLowerCase('zh-CN').includes(keyword))
              const matchesType = !typeFilter.value || node.orgType === typeFilter.value
              if (!matchesKeyword || !matchesType) continue
              visibleIds.add(node.id)
              let current = node
              while (current.parentId) {
                visibleIds.add(current.parentId)
                const parent = nodeMap.get(current.parentId)
                if (!parent) break
                current = parent
              }
            }
            return data.value.organizations.filter((node) => visibleIds.has(node.id))
          })
          """
          new = """function organizationMatchesKeyword(node: OrgArchitectureNode, keyword: string): boolean {
            if (!keyword) return true
            return [node.orgName, node.orgCode, orgTypeLabel(node.orgType)]
              .some((value) => value.toLocaleLowerCase('zh-CN').includes(keyword))
          }

          function organizationMatchesType(node: OrgArchitectureNode): boolean {
            return !typeFilter.value || node.orgType === typeFilter.value
          }

          function organizationMatchesFilters(node: OrgArchitectureNode, keyword: string): boolean {
            return organizationMatchesKeyword(node, keyword) && organizationMatchesType(node)
          }

          function addOrganizationTrail(
            node: OrgArchitectureNode,
            nodeMap: ReadonlyMap<string, OrgArchitectureNode>,
            visibleIds: Set<string>,
          ): void {
            visibleIds.add(node.id)
            let current = node
            while (current.parentId) {
              visibleIds.add(current.parentId)
              const parent = nodeMap.get(current.parentId)
              if (!parent) return
              current = parent
            }
          }

          const displayedOrganizations = computed(() => {
            const keyword = props.mode === 'architecture' ? query.value.trim().toLocaleLowerCase('zh-CN') : ''
            if (!keyword && !typeFilter.value) return data.value.organizations

            const nodeMap = new Map(data.value.organizations.map((node) => [node.id, node]))
            const visibleIds = new Set<string>()
            data.value.organizations
              .filter((node) => organizationMatchesFilters(node, keyword))
              .forEach((node) => addOrganizationTrail(node, nodeMap, visibleIds))
            return data.value.organizations.filter((node) => visibleIds.has(node.id))
          })
          """
          if old not in text:
              raise SystemExit('OrgDirectoryPage.vue target block not found')
          directory.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Install and verify frontend
        shell: bash
        working-directory: technical-platform/web
        run: |
          npm install --global pnpm@10.34.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint

      - name: Commit verified fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-org-ui-lint.yml
          git add \
            technical-platform/web/src/platform/pages/org/OrgArchitectureTechPage.vue \
            technical-platform/web/src/platform/pages/org/OrgArchitectureTree.vue \
            technical-platform/web/src/platform/pages/org/OrgDirectoryPage.vue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(org-ui): satisfy strict frontend quality gates'
          git push origin HEAD:feat/replicate-org-detail-pages-20260824
