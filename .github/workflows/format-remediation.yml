name: S8020 formatter remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: s8020-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: generate-palantir-format-output
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply repository formatter
        shell: bash
        run: bash ./mvnw -B -ntp spotless:apply

      - name: Package exact formatted sources
        shell: bash
        run: |
          set -euo pipefail
          zip -q /tmp/s8020-formatted-java.zip \
            technical-platform/backend/modules/org/src/main/java/cn/shangjingu/platform/org/application/OrgArchitectureService.java \
            technical-platform/backend/modules/org/src/main/java/cn/shangjingu/platform/org/infrastructure/RemediatedOrgArchitectureRepository.java

      - name: Upload exact formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: s8020-formatted-java-${{ github.sha }}
          path: /tmp/s8020-formatted-java.zip
          retention-days: 1
