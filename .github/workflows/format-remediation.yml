name: S8020 formatter remediation

on:
  push:
    branches: [fix/org-directory-remediation-20260823]

permissions:
  contents: write

concurrency:
  group: s8020-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: commit-all-palantir-format-output
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply repository formatter
        shell: bash
        run: bash ./mvnw -B -ntp spotless:apply

      - name: Commit all formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo 'Formatter produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply all repository Java formatting'
          git push origin HEAD
