name: S8020 formatter remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: s8020-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: commit-palantir-format-output
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply repository formatter
        shell: bash
        run: bash ./mvnw -B -ntp spotless:apply

      - name: Commit exact formatter output
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            technical-platform/backend/modules/org/src/main/java/cn/shangjingu/platform/org/application/OrgArchitectureService.java \
            technical-platform/backend/modules/org/src/main/java/cn/shangjingu/platform/org/infrastructure/RemediatedOrgArchitectureRepository.java
          if git diff --cached --quiet; then
            echo 'Formatter produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply repository Java formatter'
          git push origin "HEAD:${HEAD_REF}"
